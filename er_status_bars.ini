; er_status_bars: the file is re-read while the game runs, about a second after it is saved.
; Lengths are in pixels of a 1920x1080 picture.
[Panel]
Enabled = 1
Scale = 1
OffsetX = 0
OffsetY = 0
Opacity = 1
; Solid plate behind the bars. It hides the game's own bars; switch it off only if they are hidden another way.
Backing = 1
ShowName = 1
ShowNumbers = 1
ShowLevel = 1
; Seconds the game's interface has to stay up before the panel comes in.
ShowDelay = 0
; Keeps the panel away while the game fades the screen. Switch it off if the panel never appears.
HideDuringFade = 1
; Hides the panel while a game menu or a popup is open. Switch it off if the panel goes missing during play.
HideInMenus = 1

[Bars]
; Bar length = maximum value * pixels per point, kept between MinLength and MaxLength.
; Raise a value if the game's bar shows from under the panel on the right.
HpPixelsPerPoint = 0.4
FpPixelsPerPoint = 1.75
StaminaPixelsPerPoint = 3
MinLength = 60
MaxLength = 900

[Debug]
Log = 1
